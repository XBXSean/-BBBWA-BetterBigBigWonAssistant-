name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  protocol-tests:
    name: Protocol tests (bbw-protocol)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbw-protocol
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: node --test test/

  webui-build:
    name: Build web UI (bbw-webui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbw-webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bbw-webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbw-webui-dist
          path: bbw-webui/dist
          if-no-files-found: error

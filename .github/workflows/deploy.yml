name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: bbw-webui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bbw-webui

      - name: Build
        run: npm run build
        working-directory: bbw-webui

      - name: Add .nojekyll
        run: touch bbw-webui/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bbw-webui/dist
